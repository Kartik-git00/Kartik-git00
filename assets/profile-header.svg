    <path d="M0-43L37-22V22L0 43-37 22V-22Z" fill="#112d36" stroke="#b5f36b" stroke-width="2"/>
    <path d="M-14 0L-4 10 17-12" stroke="#b5f36b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#61e8f0"><circle cy="-104" r="5"/><circle cx="90" cy="-52" r="5"/><circle cx="90" cy="52" r="5"/><circle cy="104" r="5"/><circle cx="-90" cy="52" r="5"/><circle cx="-90" cy="-52" r="5"/></g>
