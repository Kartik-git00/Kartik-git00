<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Kartik Dave | Cybersecurity and code</title>
  <desc id="desc">BL4CK0UTS3C. Learn the system. Understand the network. Build with purpose. An animated network and terminal cursor decorate this banner.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080f1d"/><stop offset="1" stop-color="#102b36"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#61e8f0"/><stop offset="1" stop-color="#b5f36b"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#61e8f0" stroke-opacity=".06"/></pattern>
    <style>
      text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .cursor{animation:blink 1.2s steps(2,end) infinite}
      @keyframes blink{50%{opacity:0}}
      @media(prefers-reduced-motion:reduce){.cursor{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <path d="M28 22H1172" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="50" cy="53" r="5" fill="#ff6b7a"/><circle cx="70" cy="53" r="5" fill="#ffd166"/><circle cx="90" cy="53" r="5" fill="#b5f36b"/>
  <text x="114" y="58" fill="#8ba4b8" font-size="13" letter-spacing="2">BL4CK0UTS3C / LEARNING IN PUBLIC</text>
  <text x="52" y="116" fill="#b5f36b" font-size="15" letter-spacing="3">CYBERSECURITY · LINUX · CODE</text>
  <text x="48" y="188" fill="#f1f7fc" font-size="62" font-weight="700" letter-spacing="-2">Kartik Dave<tspan fill="#61e8f0">.</tspan></text>
  <text x="52" y="230" fill="#a7bdcd" font-size="18">Learn the system. Understand the network.</text>
  <text x="52" y="259" fill="#a7bdcd" font-size="18">Build with purpose.</text>
  <text x="52" y="316" fill="#61e8f0" font-size="15">&gt; learning by doing</text>
  <rect class="cursor" x="235" y="302" width="9" height="18" fill="#b5f36b"/>
  <g transform="translate(905 185)" fill="none">
